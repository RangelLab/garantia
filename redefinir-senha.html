<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101815"><title>Recuperar acesso · Garantia</title><link rel="stylesheet" href="./styles.css"></head>
<body><section class="login-screen"><div class="login-card"><a class="login-brand" href="./"><span class="brand-copy"><strong>Garantia</strong><small>By Borges &amp; Rangel</small></span></a><p class="eyebrow login-eyebrow">CONTA INDEPENDENTE</p><h1 id="title">Recuperar <span>acesso.</span></h1><p class="login-copy" id="copy">Informe seu e-mail. Se houver uma conta ativa, enviaremos um link para redefinir a senha.</p><form id="form" class="login-form"><label class="field" id="email-field">E-mail<input id="email" type="email" autocomplete="email" maxlength="254" required placeholder="voce@exemplo.com"></label><label class="field" id="password-field" hidden>Nova senha<input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p class="login-message" id="message" role="status" hidden></p><button class="primary-button login-submit" id="submit" type="submit">Enviar instruções</button></form><div class="login-links"><a href="./">Voltar ao login</a></div></div></section>
<script src="./supabase-config.js"></script><script>
const api=(action,payload)=>fetch((window.GARANTIA_SUPABASE_CONFIG?.url||"").replace(/\/$/,"")+"/functions/v1/garantia-api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...payload})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||"Não foi possível concluir a solicitação.");return d;});
const params=new URLSearchParams(location.search),token=params.get("token"),form=document.querySelector("#form"),message=document.querySelector("#message"),button=document.querySelector("#submit");
if(!token){document.querySelector("#password").required=false;}
if(token){document.querySelector("#title").innerHTML="Criar nova <span>senha.</span>";document.querySelector("#copy").textContent="Defina uma senha com pelo menos 10 caracteres.";document.querySelector("#email-field").hidden=true;document.querySelector("#email").required=false;document.querySelector("#password-field").hidden=false;document.querySelector("#password").required=true;button.textContent="Salvar nova senha";}
form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;message.hidden=true;try{if(token){await api("reset_password",{token,password:document.querySelector("#password").value});message.textContent="Senha atualizada. Você já pode entrar no Garantia.";document.querySelector("#form").hidden=true;}else{await api("request_password_reset",{email:document.querySelector("#email").value.trim()});message.textContent="Se houver uma conta elegível, enviaremos as instruções para o e-mail informado.";}message.hidden=false;message.classList.add("success");}catch(err){message.textContent=err.message;message.hidden=false;}finally{button.disabled=false;}});
</script></body></html>
