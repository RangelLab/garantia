<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101815"><title>Criar conta · Garantia</title><link rel="stylesheet" href="./styles.css"></head>
<body><section class="login-screen"><div class="login-card"><a class="login-brand" href="./"><span class="brand-copy"><strong>Garantia</strong><small>By Borges &amp; Rangel</small></span></a><p class="eyebrow login-eyebrow">CONTA INDEPENDENTE</p><h1>Crie sua <span>conta.</span></h1><p class="login-copy">Esta conta é exclusiva do Garantia e não altera seu acesso aos outros aplicativos.</p>
<form id="form" class="login-form">
<label class="field">Nome<input id="name" required maxlength="100" autocomplete="name"></label>
<label class="field">E-mail<input id="email" type="email" required maxlength="254" autocomplete="email"></label>
<label class="field">Senha<input id="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"><small>Use pelo menos 10 caracteres.</small></label>
<p class="login-message" id="message" role="status" hidden></p><button class="primary-button login-submit" id="submit" type="submit">Criar conta</button></form>
<div class="login-links"><a href="./">Voltar ao login</a></div></div></section>
<script src="./supabase-config.js"></script><script>
const api=(action,payload)=>fetch((window.GARANTIA_SUPABASE_CONFIG?.url||"").replace(/\/$/,"")+"/functions/v1/garantia-api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...payload})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||"Não foi possível criar a conta.");return d;});
document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();const b=document.querySelector("#submit"),m=document.querySelector("#message");b.disabled=true;m.hidden=true;try{const d=await api("signup",{full_name:document.querySelector("#name").value.trim(),email:document.querySelector("#email").value.trim(),password:document.querySelector("#password").value});m.textContent=d.message;m.hidden=false;m.classList.add("success");document.querySelector("#form").reset();}catch(err){m.textContent=err.message;m.hidden=false;}finally{b.disabled=false;}});
</script></body></html>
